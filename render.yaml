services:
  - type: web
    name: smart-it-helpdesk
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn render_start:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    initialDeployHook: python provision_admin.py
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-it-helpdesk-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: SEED_DEMO_DATA
        value: "0"
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: smart-it-helpdesk-db
    databaseName: smart_it_helpdesk
    user: smart_it_helpdesk
    region: singapore
    plan: free
